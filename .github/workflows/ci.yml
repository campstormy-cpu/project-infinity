# STATUS: executed on GitHub since 2026-10-28 (first run failed because the runner exits 1 while release_ready is False).
# --ci makes the job green when GATE_01..04 pass. GREEN DOES NOT MEAN RELEASE-READY: gates 05-08 are still printed
# and release_ready stays False until audits and owner approval exist.
name: infinity-gates
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GATE_04 verifies code hashes with `git show <commit>:<path>`
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Run release gates
        run: python3 infrastructure/run_gates.py --ci
